name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows Server 2022 shares its core with Windows 10, Server 2025 with Windows 11
    # (GitHub offers no desktop Windows runners). macos-15-intel is an Intel Mac,
    # macos-latest an Apple Silicon Mac.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "Pillow>=10.0" "coverage>=7.4" "playwright>=1.45"
      - name: Browser for the interface tests
        run: python -m playwright install chromium
      - name: Tests (with coverage)
        env:
          PCCLEANER_SCREENSHOTS: screenshots
        run: python -m coverage run --source=pccleaner -m unittest discover -s tests -v
      - name: Screenshots of every screen, Vietnamese and English
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.os }}
          path: screenshots/
      - name: Coverage of the shared core must stay at 80% or more
        shell: bash
        run: |
          python -m coverage report --omit="pccleaner/app.py,pccleaner/platforms/windows.py,pccleaner/platforms/macos.py,pccleaner/platforms/linux.py,pccleaner/platforms/speed_windows.py,pccleaner/platforms/speed_macos.py,pccleaner/platforms/speed_linux.py" --fail-under=80
          echo "--- this system's own module:"
          python -m coverage report --include="pccleaner/platforms/*.py"
      - name: Rescan of 100,000 files must be 3x faster than the first scan
        run: python tools/bench_scan.py 100000 3

  package:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: PCCleaner-windows
          - os: macos-latest
            artifact: PCCleaner-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-build.txt
      - name: Build app
        shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          # The operating-system parts (pccleaner.platforms.*) are imported by a name built
          # at run time. "python -m" puts this folder on the path, so --collect-submodules
          # finds the package (plain "pyinstaller" found nothing and the app crashed on start).
          python -m PyInstaller --noconfirm --windowed --name PCCleaner --collect-submodules pccleaner \
            --add-data "pccleaner/web${SEP}pccleaner/web" run.py
      - name: The packaged app starts and finds all its parts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Start-Process -Wait -FilePath 'dist\PCCleaner\PCCleaner.exe' -ArgumentList '--self-test','self-test.txt'"
          else
            dist/PCCleaner.app/Contents/MacOS/PCCleaner --self-test self-test.txt
          fi
          cat self-test.txt
          grep -q '^ok ' self-test.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
